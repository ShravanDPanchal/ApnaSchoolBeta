version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: apna_school_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_2026
      POSTGRES_DB: apna_school_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: apna_school_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: apna_school_api
    restart: always
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres_password_2026@postgres:5432/apna_school_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secure_apna_school_secret_key_2026
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: apna_school_web
    restart: always
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
